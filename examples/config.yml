# Cargo example configuration file
# Copy this file to ~/.cargo/config.yml and adjust to your environment.
# Run 'cargo init' first to generate SSL certs, age keys, and auth token.

# Directory where project repositories and runtime data are stored.
# Default: ~/.cargo/workdir
workdir: ~/.cargo/workdir

# When running containerized set the following options to the workdir path on the docker host:
host_workdir: ~/.cargo/workdir

server:
  # IP address or hostname to bind the HTTPS REST API server on.
  # Use "0.0.0.0" to listen on all interfaces.
  # Default: 0.0.0.0
  host: "0.0.0.0"

  # Port for the HTTPS REST API.
  # Default: 8443
  port: 8443

projects:
  # --- Example 1: Public GitHub repo, main branch, no SOPS ---
  - name: my-public-app
    git:
      url: "https://github.com/example/my-public-app.git"
      # Branch, tag, or full commit SHA to checkout.
      # Default: main
      revision: "main"
    compose:
      # Subdirectory within the repository that contains the compose file.
      # Leave empty if the compose file is in the repository root.
      path: ""
      # Name of the compose file. Default: docker-compose.yml
      file: "docker-compose.yml"
    # Polling interval: sync automatically on this interval.
    # Valid Go duration strings: "5m", "1h30m", "30s", etc.
    # Leave empty to disable polling (manual sync only).
    poll_interval: "10m"
    sops:
      enabled: false

  # --- Example 2: Private repo via SSH key, specific subfolder, SOPS enabled ---
  - name: my-private-app
    git:
      url: "git@github.com:myorg/private-infra.git"
      revision: "production"
      # Path to the SSH private key for authenticating with the git server.
      ssh_key: "~/.ssh/id_ed25519"
    compose:
      # The docker-compose.yml is inside the 'services/my-app' subfolder of the repo.
      path: "services/my-app"
      file: "docker-compose.yml"
    # No polling — sync manually via 'cargo project sync my-private-app'
    # or POST /api/v1/projects/my-private-app/sync
    sops:
      enabled: true
      # Path to the age private key file generated by 'cargo init'.
      age_key: "~/.cargo/workdir/age.key"
      # Path to the SOPS-encrypted .env file within the repository.
      env_file: "services/my-app/.env.enc"

  # --- Example 3: Private HTTPS repo with username/password ---
  - name: my-gitlab-app
    git:
      url: "https://gitlab.example.com/myorg/myproject.git"
      revision: "v2.3.1"
      # For GitLab/GitHub: use a personal access token as the password.
      username: "myuser"
      password: "glpat-xxxxxxxxxxxxxxxxxxxx"
    compose:
      path: "deploy"
      file: "docker-compose.prod.yml"
    poll_interval: "30m"
    sops:
      enabled: false
